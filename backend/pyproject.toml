[project]
name = "deadparrots"
version = "0.1.0"
description = "Dead Parrots Dashboard — RIP TIDE League decision-support backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "apscheduler>=3.10,<4",
    "duckdb>=1.1",
    "pydantic-settings>=2.5",
    "nflreadpy>=0.1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    # Parsing docker-compose.yml in test_deployment_compose.py (issue #20). Also
    # pulled transitively by uvicorn[standard]; pinned here so the guard test
    # never silently skips.
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deadparrots"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "gate: the 2025 Yahoo scoring validation gate — the highest-weight test in the repo",
]
