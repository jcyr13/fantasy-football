# Two deployables + the consensus sidecar, per docs/adr/0003.
#   api      FastAPI backend, owns all numeric logic; hosts the scheduler.
#   web      nginx serving the built SPA and proxying /api to api.
#   rsidecar ffanalytics consensus feed — a one-shot, not a service (issue #8,
#            docs/adr/0005). A host timer runs `docker compose run --rm rsidecar`
#            weekly; the api's APScheduler job re-scores whatever it drops into
#            ./data/consensus/rsidecar/ (falling back to the Sleeper API).

services:
  api:
    build: ./backend
    environment:
      DEADPARROTS_DATA_DIR: /data
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

  rsidecar:
    build: ./rsidecar
    environment:
      DEADPARROTS_DATA_DIR: /data
    volumes:
      - ./data:/data
    # One-shot: it scrapes ffanalytics once and exits. No restart — it is
    # invoked on a schedule from the host, not kept running.
    restart: "no"
    profiles: ["sidecar"]
